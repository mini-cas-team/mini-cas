version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Propagate environment variables to the Next.js runtime environment
        - echo "DATABASE_URL=${DATABASE_URL}" >> .env.production
        - echo "S3_BUCKET_NAME=${S3_BUCKET_NAME}" >> .env.production
        - echo "MINI_CAS_AWS_REGION=${MINI_CAS_AWS_REGION}" >> .env.production
        - echo "MINI_CAS_AWS_ACCESS_KEY_ID=${MINI_CAS_AWS_ACCESS_KEY_ID}" >> .env.production
        - echo "MINI_CAS_AWS_SECRET_ACCESS_KEY=${MINI_CAS_AWS_SECRET_ACCESS_KEY}" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
